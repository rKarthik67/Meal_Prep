name: meal_prep
description: Book a home cook to prepare fresh meals in your kitchen.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  fl_chart: ^1.2.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/emoji/
    - assets/icon/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#E5632B"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#E5632B"
    theme_color: "#E5632B"

# `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFF6EE"
  image: assets/icon/splash_logo.png
  color_dark: "#1C1512"
  android_12:
    color: "#FFF6EE"
    image: assets/icon/app_icon_foreground.png
    color_dark: "#1C1512"
  web: true
